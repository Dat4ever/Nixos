[mgr]
show_hidden = false
sort_by = "natural"
sort_sensitive = false
linemode = "size"
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
image_filter = "lanczos3"
image_quality = 85

[opener]
edit = [
  { run = 'nvim "$@"', block = true, desc = "Open with neovim" },
  { run = 'vim "$@"', block = true, desc = "Open with vim" },
]

# Package vlc and mpv
play = [
  { run = 'vlc "$@"', orphan = true, desc = "Play with vlc" },
  { run = 'mpv "$@"', orphan = true, desc = "Play with mpv" },
]

# Package imv
image_view = [
  { run = 'imv "$@"', orphan = true, desc = "Open with imv" },
]

reveal = [
  { run = "xdg-open %d1", orphan = true, desc = "Reveal" },
]

open = [
  { run = 'xdg-open "$@"', orphan = true, desc = "Open" },
]

[open]
rules = [
  { mime = "text/*", use = [ "edit", "reveal" ] },
  { mime = "{video,audio}/*", use = [ "play", "open", "reveal" ] },
  { mime = "image/*", use = [ "image_view", "open", "reveal" ] },
  { url = "*", use = [ "open", "reveal" ] },
]

[plugin]
# Plugin git.yazi
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
