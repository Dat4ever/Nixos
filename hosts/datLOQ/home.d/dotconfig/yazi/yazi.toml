[mgr]
show_hidden = false
sort_by = "natural"
sort_sensitive = false
linemode = "size"
show_symlink = true

[preview]
tab_size = 2
max_width = 1000
max_height = 1000
image_filter = "lanczos3"
image_quality = 85

[opener]
edit = [
  { run = 'nvim %s', block = true, desc = "Open with neovim" },
  { run = 'vim %s', block = true, desc = "Open with vim" },
]

# Package vlc and mpv
play = [
  { run = 'vlc %s', orphan = true, desc = "Play with vlc" },
  { run = 'mpv %s', orphan = true, desc = "Play with mpv" },
]

# Package mpv
image_view = [
  { run = 'mpv --image-display-duration=inf %s', orphan = true, desc = "View with mpv" },
]

# Uses the `extract` bash function from ~/.bashrc
extract = [
  { run = 'bash -ic "extract %s"', block = true, desc = "Extract archive" },
]

reveal = [
  { run = "xdg-open %d1", orphan = true, desc = "Reveal" },
]

open = [
  { run = 'xdg-open %s', orphan = true, desc = "Open" },
]

[open]
rules = [
  { mime = "text/*", use = [ "edit", "reveal" ] },
  { mime = "{video,audio}/*", use = [ "play", "open", "reveal" ] },
  { mime = "image/*", use = [ "image_view", "open", "reveal" ] },
  { url = "*.cbz", use = [ "image_view", "open", "reveal" ] },
  { url = "*.cbr", use = [ "image_view", "open", "reveal" ] },
  { url = "*.zip", use = [ "extract" ] },
  { url = "*.tar.gz", use = [ "extract" ] },
  { url = "*.tar.bz2", use = [ "extract" ] },
  { url = "*.tar.xz", use = [ "extract" ] },
  { url = "*.tbz2", use = [ "extract" ] },
  { url = "*.tgz", use = [ "extract" ] },
  { url = "*.tar", use = [ "extract" ] },
  { url = "*.gz", use = [ "extract" ] },
  { url = "*.bz2", use = [ "extract" ] },
  { url = "*.rar", use = [ "extract" ] },
  { url = "*.7z", use = [ "extract" ] },
  { url = "*.Z", use = [ "extract" ] },
  { url = "*/", use = [ "open", "reveal" ] },
  { url = "*", use = [ "open", "reveal" ] },
]

[plugin]
# Plugin git.yazi
prepend_fetchers = [
  { url = "*",  run = "git", group = "git" },
  { url = "*/", run = "git", group = "git" },
]
